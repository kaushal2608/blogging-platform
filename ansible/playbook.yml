---
- name: Configure Application Server
  hosts: app
  become: true

  tasks:

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker and Docker Compose
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Start Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Verify Docker
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Verify Docker Compose
      command: docker compose version
      register: compose_version
      changed_when: false

    - name: Show Docker version
      debug:
        var: docker_version.stdout

    - name: Show Docker Compose version
      debug:
        var: compose_version.stdout


- name: Configure Database Server
  hosts: db
  become: true

  tasks:

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install MySQL
      apt:
        name:
          - mysql-server
          - python3-pymysql
        state: present

    - name: Configure MySQL to accept network connections
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
      notify: Restart MySQL

    - name: Start MySQL
      systemd:
        name: mysql
        state: started
        enabled: true

    - name: Create ecommerce database
      shell: |
        mysql -u root <<'SQL'
        CREATE DATABASE IF NOT EXISTS ecomdb;
        SQL
      changed_when: false

    - name: Create ecommerce database user
      shell: |
        mysql -u root <<'SQL'
        CREATE USER IF NOT EXISTS 'ecomuser'@'%' IDENTIFIED BY 'ecompassword';
        GRANT ALL PRIVILEGES ON ecomdb.* TO 'ecomuser'@'%';
        CREATE USER IF NOT EXISTS 'ecomuser'@'10.0.1.%' IDENTIFIED BY 'ecompassword';
        GRANT ALL PRIVILEGES ON ecomdb.* TO 'ecomuser'@'10.0.1.%';
        FLUSH PRIVILEGES;
        SQL
      changed_when: false

    - name: Create products table
      shell: |
        mysql -u root ecomdb <<'SQL'
        CREATE TABLE IF NOT EXISTS products (
          id INT AUTO_INCREMENT PRIMARY KEY,
          name VARCHAR(255) NOT NULL,
          price DECIMAL(10, 2) NOT NULL,
          description TEXT NOT NULL,
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
        );
        SQL
      changed_when: false

    - name: Insert sample products
      shell: |
        mysql -u root ecomdb <<'SQL'
        INSERT INTO products (name, price, description)
        SELECT 'Laptop', 55000.00, 'High performance laptop for development'
        WHERE NOT EXISTS (
          SELECT 1 FROM products WHERE name = 'Laptop'
        );
        INSERT INTO products (name, price, description)
        SELECT 'Wireless Mouse', 800.00, 'Ergonomic 2.4GHz wireless optical mouse'
        WHERE NOT EXISTS (
          SELECT 1 FROM products WHERE name = 'Wireless Mouse'
        );
        INSERT INTO products (name, price, description)
        SELECT 'Mechanical Keyboard', 2500.00, 'RGB backlit mechanical tactile keyboard'
        WHERE NOT EXISTS (
          SELECT 1 FROM products WHERE name = 'Mechanical Keyboard'
        );
        INSERT INTO products (name, price, description)
        SELECT 'Gaming Headset', 1800.00, 'Noise-cancelling surround sound headphones'
        WHERE NOT EXISTS (
          SELECT 1 FROM products WHERE name = 'Gaming Headset'
        );
        SQL
      changed_when: false

    - name: Verify MySQL
      command: mysql --version
      register: mysql_version
      changed_when: false

    - name: Show MySQL version
      debug:
        var: mysql_version.stdout

    - name: Verify ecommerce database
      shell: mysql -u root -e "SHOW DATABASES;" | grep -w ecomdb
      register: database_check
      changed_when: false

    - name: Show database verification
      debug:
        var: database_check.stdout

  handlers:

    - name: Restart MySQL
      systemd:
        name: mysql
        state: restarted