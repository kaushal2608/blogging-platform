version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ecommerce-backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: ${DB_HOST:-10.0.3.75}
      DB_USER: ${DB_USER:-ecomuser}
      DB_PASSWORD: ${DB_PASSWORD:-ecompassword}
      DB_NAME: ${DB_NAME:-ecomdb}
    networks:
      - ecommerce-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ecommerce-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ecommerce-network
    restart: unless-stopped

networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge